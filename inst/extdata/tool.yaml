# VITROB: risk-of-bias tool for in vitro experiments
# Single source of truth for questions, skip logic and algorithms.
# The Word/Docs form, the Excel template, the R package and the Shiny app
# should all be generated from or checked against this file.
#
# Rule language (identical in R and Python):
# Answer codes are quoted throughout because YAML 1.1 parsers
# (including the R yaml package) may read bare Y and N as booleans.
#   yes("q")  -> answer is Y or PY
#   no("q")   -> answer is N or PN
#   ni("q")   -> answer is NI
#   combine with &, | and parentheses. A skipped question (NA) is never
#   yes, no or ni.
# Each domain has a `low` and a `high` rule; any other answer pattern gives
# "Some concerns". The verification checks that low and high never both hold.

tool:
  name: "VITROB: risk-of-bias tool for in vitro experiments"
  acronym: VITROB
  version: 1.0.0-rc.4
  date: 2026-11-24
  licence: CC-BY-4.0
  scope: >-
    One specified quantitative result from an in vitro experiment comparing
    a condition to which the investigator assigned a manipulation with a
    concurrent comparator. The questions are generic; their application to
    each class of in vitro system is examined in pilot testing. Not covered
    in v1.0: comparisons whose only counterfactual is an earlier period of
    the same units (uncontrolled before-after designs) and crossover designs,
    which need questions on period and carry-over effects. Concurrent-group
    experiments that analyse change from baseline are covered.

response_options:
  "Y":  {label: "Yes", group: "yes"}
  "PY": {label: "Probably yes", group: "yes"}
  "PN": {label: "Probably no", group: "no"}
  "N":  {label: "No", group: "no"}
  "NI": {label: "No information", group: "ni"}

judgments: [Low, Some concerns, High]

# Preliminary fields A-F, recorded for every result (template columns).
result_fields:
  - {id: A_target_outcome, field: A, required: true, label: "Target outcome (the quantity of interest)"}
  - {id: A_measurement, field: A, required: true, label: "Operational measurement (assay and readout)"}
  - {id: A_manipulation, field: A, required: true, label: "Manipulation"}
  - {id: A_comparator, field: A, required: true, label: "Comparator"}
  - {id: A_effect_measure, field: A, required: true, label: "Effect measure and its scale"}
  - {id: C_effect_of_interest, field: C, required: true, options: ["Applying", "Target"], label: "Effect of interest: applying the manipulation, or a target-defined effect"}
  - {id: D_allocation_unit, field: D, required: true, label: "Unit that received the manipulation (e.g. well, flask)"}
  - {id: D_replicate, field: D, required: true, label: "Independent replicate or block (e.g. run, donor)"}
  - {id: D_n_replicates, field: D, required: false, label: "Number of independent replicates per condition"}
  - {id: D_biological_unit, field: D, required: false, label: "Biological unit of inference (e.g. cell line, donor)"}
  - {id: D_observational_unit, field: D, required: false, label: "Observational unit (e.g. technical well, image, cell)"}
  - {id: E_analysis, field: E, required: false, label: "Analysis as reported, or link to a reconstructed analysis"}
  - {id: F_sources, field: F, required: false, label: "Sources used; funding and declared interests"}

proceed_check:
  - id: B1
    text: Is there a concurrent comparator condition in the same experiment?
    stop_if: ["N", "PN"]
    reason: >-
      Without one there is no internal comparison to assess. A baseline
      period of the same units, or historical controls, is not a concurrent
      comparator.
  - id: B2
    text: "Did the investigators decide which units received the manipulation (rather than comparing units that already differed, such as cells from patients and from healthy donors)?"
    stop_if: ["N", "PN"]
    reason: Comparisons of naturally different sources need different questions on confounding.

domains:
  - id: D1
    name: Risk of bias arising from the test system
    short: Test system
    sevco: "No single equivalent (closest: selection bias, performance bias)"
    questions:
      - id: "1.1"
        short: Integrity controlled
        text: >-
          Were contamination and other integrity problems of the test system
          controlled, or shown to be absent?
        polarity: good
        y_when: >-
          Checks suited to the system were done close to the experiment (e.g.
          mycoplasma testing of cultures, strain purity, specimen inspection),
          or there is a stated reason why the hazard does not apply.
        n_when: Checks were not done although the hazard applies, or a problem was found.
        rationale: >-
          Contamination is common, often undetected, and alters host-cell
          biology; routine testing is a core good-practice requirement.
        derived_from: v0.26 Q1.2
        references: [DrexlerUphoff2002, OlarerinGeorge2015, GCCP2022, GIVIMP2025]
      - id: "1.2"
        short: Integrity problem likely
        text: >-
          Is there a known or likely integrity problem that differs between
          conditions in a way likely to distort this comparison?
        ask_if: 'no("1.1") | ni("1.1")'
        polarity: problem
        y_when: >-
          A problem found or likely that differs between conditions (e.g.
          contamination of some flasks or conditions only) and is likely to
          distort this comparison.
        n_when: >-
          No evidence of a problem, or a problem shared by all conditions. A
          shared problem is routed by mechanism: reduced exposure to 3.1,
          assay interference to 4.2, changed biology of the system to AP2.
        rationale: >-
          Separates absence of a check from the consequence of a problem, so a
          missing test alone cannot give High (process/consequence split as in
          RoB 2 SQ 3.3-3.4).
        derived_from: v0.26 Q1.3 (narrowed to integrity)
        references: [Sterne2019, OlarerinGeorge2015, BenDavid2018]
      - id: "1.3"
        short: State differs at start
        text: >-
          Did the state of the test system at the start of the manipulation
          differ between conditions in a way likely to affect the outcome
          (passage, confluence, growth phase, differentiation, specimen preparation)?
        polarity: problem
        y_when: >-
          Conditions seeded at different densities or times, taken from
          different passages, or prepared differently, in a way likely to
          affect the outcome importantly.
        note: Unfavourable only when the problem is likely to distort the estimated effect importantly; NI when the problem exists but its likely impact cannot be determined.
        n_when: >-
          Units were split from common material at the same time, or state was
          checked and found comparable.
        rationale: >-
          In vitro counterpart of RoB 2 SQ 1.3. IC50 and Emax depend on the
          number of cell divisions during the assay, so differences in seeding
          or growth state alone shift drug-response metrics. Units from different
          stocks or donors per condition are answered in 2.3, not here.
        derived_from: New (previously part of v0.26 Q1.2 and Q2.3)
        references: [Sterne2019, DRIVER2026, Hafner2016, BenDavid2018, GCCP2022]
    rules:
      low: 'yes("1.1") & no("1.3")'
      high: 'yes("1.2") | yes("1.3")'

  - id: D2
    name: Risk of bias due to confounding and allocation
    short: Confounding and allocation
    sevco: Selection bias; confounding
    questions:
      - id: "2.1"
        short: Comparator matched
        text: >-
          Apart from the manipulation, was the comparator condition, as
          planned, the same as the manipulated condition in every respect
          likely to affect the estimated effect (vehicle at the same
          concentration, planned handling and time in culture)?
        polarity: good
        y_when: >-
          Vehicle or sham matched; handling and timing identical; or any
          remaining difference could not plausibly affect the outcome. For an
          active comparator, the contrast defined in field A.
        n_when: >-
          A difference other than the manipulation that is likely to distort
          the estimated effect importantly, e.g. an untreated control for a
          compound dissolved in DMSO at a concentration known to affect this
          outcome; different exposure times.
        note: >-
          Answer NI when a difference exists but its importance for this
          outcome cannot be judged. 2.1 assesses the planned comparator;
          unplanned departures during the experiment are assessed in 3.2.
        rationale: >-
          A mismatched comparator attributes vehicle or handling effects to the
          manipulation; 0.1% DMSO altered more than 2,000 genes in 3D microtissues.
        derived_from: v0.26 Q2.1
        references: [Verheijen2019, GIVIMP2025, DRIVER2026]
      - id: "2.2"
        short: Allocation free of choice
        text: >-
          Were units allocated to conditions at random, or by a fixed scheme
          that left no room for choices influenced by the expected response?
        polarity: good
        y_when: >-
          Randomisation; a layout fixed in advance; common material split
          before any unit-specific information was seen.
        n_when: >-
          The investigator chose which wells, flasks, specimens or donors
          received each condition after seeing them.
        rationale: >-
          Discretionary allocation is the selection mechanism targeted by RoB 2
          Domain 1 and SYRCLE. Evidence that it changes results comes from
          trials and animal studies; no in vitro study has yet tested it.
          N/PN alone gives Some concerns (proportionate approach, DRIVER).
        derived_from: v0.26 Q2.2
        references: [Sterne2019, Hooijmans2014, DRIVER2026, Bebarta2003]
      - id: "2.3"
        short: Aligned with batch or position
        text: "Did the conditions coincide with another factor that could affect the outcome (plate position, run or day, operator, instrument, reagent lot, source stock or donor)?"
        polarity: problem
        y_when: >-
          e.g. all treated wells on outer rows; treated and control units run on
          different days or from different stocks.
        n_when: >-
          Each run, plate or donor contains all conditions; positions are
          balanced; or several runs, plates or donors were randomly assigned to
          each condition and processed under a common protocol. When the run is
          itself the unit randomly assigned, its identity is not an aligned
          factor.
        rationale: >-
          Plate position, run and batch are the in vitro counterparts of
          SYRCLE's random-housing item; batch effects correlated with the
          outcome lead to incorrect conclusions.
        derived_from: v0.26 Q2.3
        references: [Leek2010, Lundholt2003, Hooijmans2014]
      - id: "2.4"
        short: Factors separated
        text: >-
          Was the effect of these factors separated from condition by design or
          analysis (blocking, pairing, adjustment, every condition replicated
          within each run)?
        ask_if: 'yes("2.3") | ni("2.3")'
        polarity: good
        y_when: >-
          Separation is built into the design (blocking, pairing, random
          assignment of several runs or donors to each condition) or the
          analysis (adjustment with sufficient overlap).
        n_when: >-
          Factors cannot be separated, e.g. all treated samples processed on
          one day and all controls on another, or a single run per condition.
        rationale: >-
          Separates whether a factor travelled with condition from whether it
          was handled. Baseline significance tests do not count as separation.
        derived_from: v0.26 Q2.3 guidance
        references: [deBoer2015, Leek2010]
    rules:
      low: 'yes("2.1") & yes("2.2") & (no("2.3") | yes("2.4"))'
      high: 'no("2.1") | (yes("2.3") & no("2.4"))'

  - id: D3
    name: Risk of bias due to deviations in the experimental procedure
    short: Deviations in procedure
    sevco: Performance bias
    questions:
      - id: "3.1"
        short: Delivered as specified
        text: >-
          Was the manipulation delivered as specified (identity and
          preparation, concentration reaching the system, timing and duration)
          and kept out of the comparator units? If the effect of interest is achieving a target (field C), was
          achievement shown?
        polarity: good
        y_when: >-
          Preparation and delivery documented; stability or solubility
          addressed where relevant; target engagement measured when it defines
          the effect.
        n_when: >-
          Evidence of failure: precipitation, degradation (including by a
          contaminant, e.g. mycoplasma enzymes inactivating gemcitabine), loss
          to plastic, or transfer into comparator units (carry-over, vapour
          transfer between wells). Insufficient knockdown or target engagement
          counts only when field C specifies a target-defined effect.
        rationale: >-
          In vitro form of RoB 2's deviations from the intended intervention;
          delivery failure is common and invisible in the nominal dose.
        derived_from: v0.26 Q3.1
        references: [Groothuis2015, Jackson2003, GIVIMP2025, VandeVoorde2014]
      - id: "3.2"
        short: Handled alike
        text: >-
          Apart from the manipulation, were all conditions handled the same way
          (incubation, medium changes, washes, time to measurement)?
        polarity: good
        y_when: Same procedures and timings.
        n_when: Any condition handled differently from the planned procedure.
        note: >-
          Assesses unplanned departures during the experiment, up to harvest;
          planned differences in the comparator are assessed in 2.1, and the
          timing of reading after harvest in 4.2.
        rationale: Differential handling is performance bias; addressed by RoB 2 and SYRCLE.
        derived_from: v0.26 Q3.2
        references: [Sterne2019, Hooijmans2014, DRIVER2026]
      - id: "3.3"
        short: Decisions protected
        text: >-
          Were procedural decisions taken before the outcome was measured
          (repeating, correcting or abandoning a run; which cultures to carry
          forward) made by pre-set rules or without knowledge of condition?
        polarity: good
        y_when: >-
          Rules fixed in advance, decisions masked, or the report states the
          number of runs performed and it matches the number analysed.
        n_when: Ad hoc decisions with knowledge of condition.
        note: Answer NI when only the analysed runs are described.
        rationale: >-
          Investigators' expectations can steer discretionary steps. Indirect
          support: evidence concerns blind recording of data rather than
          procedural decisions.
        derived_from: v0.26 Q3.2 (split out)
        references: [Holman2015]
      - id: "3.4"
        short: Process checks passed
        text: >-
          Did concurrent controls or other process checks show that the run
          performed as intended (e.g. positive and negative controls within
          acceptance limits)?
        polarity: good
        y_when: Checks done and passed, or none needed for a stated reason.
        n_when: A check failed and the result was still used.
        note: >-
          Answer NI when checks are not reported. A failed check leads to 3.5,
          which judges its consequence.
        rationale: >-
          Acceptance criteria for controls show whether a run measured
          anything; SciRAP independently added a positive-control criterion.
        derived_from: v0.26 Q3.3p, Q3.3a, Q3.3b (merged)
        references: [Zhang1999, GIVIMP2025, Roth2021]
      - id: "3.5"
        short: Problem likely to matter
        text: "Were the problems found in 3.1-3.4 likely to have affected the result?"
        ask_if: 'no("3.1") | no("3.2") | no("3.3") | no("3.4")'
        polarity: problem
        y_when: >-
          The problem is likely to have changed the estimate importantly, e.g.
          by acting on one condition more than the other or by making the run
          unable to show the effect.
        n_when: The problem is unlikely to change the comparison.
        rationale: >-
          Mirrors RoB 2 SQ 2.4; a deviation or failed check matters only if it
          is likely to change the result.
        derived_from: v0.26 Q3.4 (extended to failed process checks in rc.2)
        references: [Sterne2019]
    rules:
      low: 'yes("3.1") & yes("3.2") & yes("3.3") & yes("3.4")'
      high: 'yes("3.5")'

  - id: D4
    name: Risk of bias in measurement of the outcome
    short: Outcome measurement
    sevco: Detection bias
    questions:
      - id: "4.1"
        short: Method inappropriate
        text: "Was the outcome measured with a method unsuited to the target outcome defined in field A?"
        polarity: problem
        y_when: >-
          e.g. a metabolic assay used as a measure of cell number when the
          manipulation alters metabolism; a single static marker used for flux.
        n_when: The method measures the target outcome (construct) in this system.
        note: Unfavourable only when the problem is likely to distort the estimated effect importantly; NI when the problem exists but its likely impact cannot be determined.
        rationale: Same as RoB 2 SQ 4.1; mismatch between readout and construct is a frequent in vitro error.
        derived_from: v0.26 Q4.1 (polarity reversed)
        references: [Sterne2019, Stepanenko2015, Klionsky2021, RissAGM]
      - id: "4.2"
        short: Measurement could differ
        text: "Is there evidence, or an established reason to expect, that the measurement differed between conditions enough to distort the estimated effect, including because the manipulation interferes with the assay (colour, autofluorescence, quenching, reaction with assay chemistry, cytotoxicity masking a specific readout)?"
        polarity: problem
        y_when: >-
          Different settings, timings, thresholds or reagent lots between
          conditions; a contaminant that produces or quenches signal; or
          interference that is documented, or known for this
          compound-assay pair, and not controlled (e.g. by a cell-free or
          orthogonal control).
        n_when: >-
          Identical procedures, and interference excluded, implausible or too
          small to matter. Answer NI when interference is only a theoretical
          possibility or its size cannot be judged.
        rationale: Same as RoB 2 SQ 4.2, extended to interference by the manipulation.
        derived_from: v0.26 Q4.2 and Q4.3 (merged)
        references: [Sterne2019, BaellHolloway2010, Stepanenko2015, AGM]
      - id: "4.3"
        short: Assessors aware
        text: "Did the people measuring or scoring the outcome know which condition each unit belonged to?"
        polarity: problem
        y_when: Assessors knew the condition, or awareness is evident from the design.
        n_when: Samples coded or masked.
        note: Answer NI when masking is not reported and awareness cannot be inferred.
        rationale: Same as RoB 2 SQ 4.3.
        derived_from: v0.26 Q4.4
        references: [Sterne2019, Holman2015]
      - id: "4.4"
        short: Could be influenced
        text: "Did the measurement involve judgement steps that knowledge of condition could have influenced (choice of fields or cells, gating, thresholds, scoring, exclusion of images)?"
        ask_if: 'yes("4.3") | ni("4.3")'
        polarity: problem
        y_when: Discretionary steps exist.
        n_when: Fully automated readout with no discretionary step.
        rationale: Same as RoB 2 SQ 4.4.
        derived_from: v0.26 Q4.4 guidance
        references: [Sterne2019, Holman2015]
      - id: "4.5"
        short: Likely influenced
        text: "Is it likely that knowledge of condition actually influenced those judgement steps?"
        ask_if: 'yes("4.4") | ni("4.4")'
        polarity: problem
        y_when: Discretion is substantial and the outcome is subjective, or there are signs of influence.
        n_when: Discretion is minor or tightly rule-bound.
        rationale: Same as RoB 2 SQ 4.5.
        derived_from: v0.26 Q4.5
        references: [Sterne2019]
    rules:
      low: 'no("4.1") & no("4.2") & (no("4.3") | no("4.4"))'
      high: 'yes("4.1") | yes("4.2") | yes("4.5")'

  - id: D5
    name: Risk of bias due to missing data and data processing
    short: Missing data and processing
    sevco: Attrition bias; analysis bias
    questions:
      - id: "5.1"
        short: Data complete
        text: "Do the analysed data include all, or nearly all, units assigned to each condition, and all planned observations within them?"
        polarity: good
        y_when: Assigned and analysed numbers can be reconciled at each level, with no relevant loss.
        n_when: Units or observations were lost or excluded.
        rationale: Same as RoB 2 SQ 3.1.
        derived_from: v0.26 Q5.3a
        references: [Sterne2019]
      - id: "5.2"
        short: Evidence of no bias
        text: "Do the authors show that the missing data did not bias the result (for example, by a sensitivity analysis)?"
        ask_if: 'no("5.1") | ni("5.1")'
        options: ["Y", "PY", "PN", "N"]
        polarity: good
        y_when: >-
          Sensitivity analysis, appropriate modelling of the missing values, or
          documented reasons clearly unrelated to the outcome.
        n_when: No such evidence.
        rationale: Same as RoB 2 SQ 3.2, including its answer options (no NI).
        derived_from: v0.26 Q5.3b
        references: [Sterne2019]
      - id: "5.3"
        short: Missingness could depend on value
        text: "Could whether data went missing have depended on the value of the outcome itself?"
        ask_if: 'no("5.2")'
        polarity: problem
        y_when: >-
          e.g. loss of detached dying cells (including from a viability
          measurement made only on retained cells), exclusion of low-signal
          wells, qPCR non-detects.
        n_when: Loss clearly unrelated to the outcome, e.g. a documented equipment fault.
        rationale: Same as RoB 2 SQ 3.3; in vitro loss is often outcome-related by nature.
        derived_from: v0.26 Q5.3c
        references: [Sterne2019, McCall2014, MIQE2025]
      - id: "5.4"
        short: Missingness likely depended
        text: "Is it likely that whether data went missing depended on the value of the outcome?"
        ask_if: 'yes("5.3") | ni("5.3")'
        polarity: problem
        y_when: >-
          The reasons for loss point to the outcome, or loss differs between
          conditions in a way plausibly linked to the outcome. Balanced amounts
          of loss do not exclude outcome-dependent loss.
        n_when: Reasons unrelated to the outcome, or loss too small to change the estimate.
        rationale: Same as RoB 2 SQ 3.4.
        derived_from: v0.26 Q5.4 (limited to missing data)
        references: [Sterne2019]
      - id: "5.5"
        short: Processing appropriate
        text: >-
          Were normalisation and data processing appropriate for the comparison
          and applied identically to all conditions?
        polarity: good
        y_when: >-
          Reference not affected by the manipulation, or the effect of interest
          is defined relative to it (field A); background, thresholds and
          transformations handled alike.
        n_when: >-
          e.g. a reference gene or protein changed by the manipulation when the
          effect of interest is not defined relative to it; normalising to cell
          number or another quantity changed by the manipulation when the effect
          of interest is not defined per that quantity; adjustment for a
          variable changed by the manipulation; background subtracted
          differently between conditions.
        note: Unfavourable only when the problem is likely to distort the estimated effect importantly; NI when the problem exists but its likely impact cannot be determined.
        rationale: >-
          Normalisation and processing can change the point estimate itself;
          reference genes and proteins must be stable under the manipulation.
        derived_from: v0.26 Q5.2
        references: [Vandesompele2002, MIQE2025]
      - id: "5.6"
        short: Units weighted as intended
        text: >-
          Was the effect estimate calculated so that independent replicates
          are weighted as intended (e.g. values summarised within each replicate
          before conditions are compared)?
        polarity: good
        y_when: >-
          Estimate built from independent-replicate values (field D), from a
          model that accounts for the replicate structure (e.g. a mixed model
          with run as a random effect), or any other weighting justified.
        note: Unfavourable only when the problem is likely to distort the estimated effect importantly; NI when the problem exists but its likely impact cannot be determined.
        n_when: >-
          e.g. wells pooled across runs with markedly unequal replication, or
          raw values pooled across runs before normalisation, so that some runs
          or donors dominate the estimate and the runs differ in level or
          response.
        rationale: >-
          Pooling observations with unequal replication reweights experimental
          units and can shift the point estimate. Errors that affect only the
          uncertainty are recorded in U1.
        derived_from: v0.26 Q5.1
        references: [Lazic2018]
    rules:
      low: '(yes("5.1") | yes("5.2") | no("5.3")) & yes("5.5") & yes("5.6")'
      high: 'yes("5.4") | no("5.5") | no("5.6")'

  - id: D6
    name: Risk of bias in selection of the reported result
    short: Selection of reported result
    sevco: Reporting bias
    questions:
      - id: "6.1"
        short: Pre-specified plan
        text: "Were the measurement and analysis of this result fixed independently of knowledge of the results, as shown by a plan fixed before the outcome data were seen unmasked (protocol, registration, registered report, or a dated laboratory SOP that fixes this outcome's measurement and analysis) or, exceptionally, by an established procedure that leaves no realistic choice?"
        polarity: good
        y_when: >-
          A dated plan exists and was followed for this result; PY when an
          established procedure (e.g. a test guideline) fixes the time point,
          exclusions, normalisation and analysis, so that no credible
          alternative exists for any of them.
        n_when: No plan, or the plan was changed after results were seen.
        rationale: >-
          Same as RoB 2 SQ 5.1. A missing plan alone gives Some concerns, never
          High. A general SOP counts only if dated and specific to this outcome.
        derived_from: New
        references: [Sterne2019]
      - id: "6.2"
        short: Selected measurement
        text: "Is it likely that the reported result was chosen, because of what it showed, from several eligible outcome measurements (time points, concentrations, markers, assays, fields or blots, or one \"representative\" experiment among several)?"
        polarity: problem
        y_when: >-
          Evidence that eligible measurements existed and only a favourable one
          is reported, e.g. time points listed in the methods but not reported.
        n_when: All eligible measurements are reported, or only one existed.
        rationale: Same as RoB 2 SQ 5.2, with in vitro forms of multiplicity listed.
        derived_from: v0.26 Q6.1
        references: [Sterne2019, Head2015, Errington2021]
      - id: "6.3"
        short: Selected analysis
        text: "Is it likely that the reported result was chosen, because of what it showed, from several eligible analyses of the data (normalisations, exclusion rules, transformations, statistical models, summary measures, or when to stop adding runs)?"
        polarity: problem
        y_when: >-
          Evidence that the reported analysis was chosen because of its result,
          e.g. different normalisations of one outcome in different figures
          without a reason, or runs added until significance. The existence of
          alternatives alone is not enough.
        note: >-
          Bias from data missing from the chosen estimate is assessed in D5;
          the choice of an exclusion rule among alternatives because of its
          result is assessed here.
        n_when: Analysis fixed in advance, or all reasonable analyses agree and are reported.
        rationale: Same as RoB 2 SQ 5.3.
        derived_from: v0.26 Q6.2
        references: [Sterne2019, Head2015, Simmons2011]
    rules:
      low: 'yes("6.1") & no("6.2") & no("6.3")'
      high: 'yes("6.2") | yes("6.3")'

overall:
  rule: >-
    Low if all domains are Low. High if any domain is High, or if O1 is Y/PY.
    Otherwise Some concerns.
  o1:
    id: O1
    text: >-
      Do concerns in several domains, arising from distinct mechanisms,
      together substantially lower confidence in the result?
    ask_when: Two or more domains are Some concerns and none is High.
    references: [Sterne2019]

additional_outputs:
  - id: U1
    text: >-
      Were the reported standard error, confidence interval or P value
      calculated with the independent replicate recorded in field D, rather
      than treating technical replicates or repeated observations as
      independent?
    outputs: {"Y": "unit respected", "PY": "unit respected", "PN": "unit not respected", "N": "unit not respected", "NI": unclear}
    references: [Lazic2010, Lazic2018, DRIVER2026]
  - id: AP1
    text: >-
      Was the identity of the test system verified by a method suited to it,
      and is it absent from the ICLAC register of misidentified cell lines?
    outputs: [Verified, Not verified, Listed as misidentified]
    components:
      authentication: [Confirms declared identity, Does not confirm, Not reported]
      register: [Listed, Not listed, Not applicable]
    derivation: >-
      Listed as misidentified if the register lists the line and
      authentication does not confirm the declared identity; Verified if
      authentication confirms the declared identity; otherwise Not verified.
    references: [CapesDavis2010, ICLAC2026, Horbach2017, GCCP2022]
  - id: AP2
    text: >-
      Applicability to the review question (system, manipulation, comparator,
      outcome). Covers applicability only; generalisability is outside the tool.
    outputs: [Direct, Limited, Uncertain]
    components: [system, manipulation, comparator, outcome]
    references: [Whiting2011, Whaley2026]

